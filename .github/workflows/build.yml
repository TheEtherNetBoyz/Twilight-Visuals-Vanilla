name: Build Twilight Visuals Vanilla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out mod source
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up Ninja
        shell: pwsh
        run: python -m pip install --disable-pip-version-check ninja

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch Dusklight and configure mod
        shell: pwsh
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DDUSKLIGHT_VERSION=b245c6bef8b4a370afb2453104a585dd41c97676

      - name: Configure Dusklight dependencies
        shell: pwsh
        run: >-
          cmake -S dusklight -B dusklight/build/windows-msvc -G Ninja
          -DDUSK_ENABLE_CODE_MODS=ON
          -DDUSK_ENABLE_OPUS=OFF

      - name: Reconfigure mod with generated dependencies
        shell: pwsh
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DDUSKLIGHT_DIR="${{ github.workspace }}/dusklight"
          -DDUSKLIGHT_VERSION=b245c6bef8b4a370afb2453104a585dd41c97676

      - name: Build mod package
        shell: pwsh
        run: cmake --build build-ci --target twilight_visuals_package --parallel

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-visuals-vanilla
          path: build-ci/mods/twilight_visuals.dusk
          if-no-files-found: error

  build-macos:
    # macos-14 selects Xcode 15.4, whose libc++ does not provide std::jthread.
    # Aurora requires std::jthread, so use the ARM64 macOS 15 image with Xcode 16.4.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out mod source
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up Ninja
        run: brew install ninja

      - name: Verify Apple C++20 toolchain
        run: |
          xcodebuild -version
          clang++ --version
          printf '%s\n' '#include <thread>' 'static_assert(__cpp_lib_jthread >= 201911L);' 'int main() {}' | clang++ -std=c++20 -fexperimental-library -D_LIBCPP_ENABLE_EXPERIMENTAL -fsyntax-only -x c++ -

      - name: Fetch Dusklight source
        run: >-
          cmake -S . -B build-fetch-macos -G Ninja
          -DDUSKLIGHT_VERSION=b245c6bef8b4a370afb2453104a585dd41c97676

      - name: Configure Dusklight host
        # Keep the libc++ compatibility flags for older supported toolchains. Aurora's
        # system_info.cpp also relies on TargetConditionals macros without including
        # TargetConditionals.h itself, so force-include the SDK header for this build.
        run: >-
          cmake -S dusklight -B "$RUNNER_TEMP/dusklight-build" -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_FLAGS="-fexperimental-library -D_LIBCPP_ENABLE_EXPERIMENTAL -include TargetConditionals.h"
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DDUSK_ENABLE_CODE_MODS=ON
          -DDUSK_ENABLE_OPUS=OFF

      - name: Build Dusklight host
        run: >-
          cmake --build "$RUNNER_TEMP/dusklight-build"
          --target dusklight --parallel

      - name: Configure macOS mod
        run: >-
          cmake -S . -B build-ci-macos -G Ninja
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_FLAGS="-fexperimental-library -D_LIBCPP_ENABLE_EXPERIMENTAL -include TargetConditionals.h"
          -DDUSKLIGHT_DIR="${{ github.workspace }}/dusklight"
          -DDUSKLIGHT_BUILD_DIR="$RUNNER_TEMP/dusklight-build"
          -DDUSK_GAME_EXE="$RUNNER_TEMP/dusklight-build/Dusklight.app/Contents/MacOS/Dusklight"
          -DDUSKLIGHT_VERSION=b245c6bef8b4a370afb2453104a585dd41c97676

      - name: Build macOS mod package
        run: >-
          cmake --build build-ci-macos
          --target twilight_visuals_package --parallel

      - name: Upload macOS mod package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-visuals-vanilla-macos-arm64
          path: build-ci-macos/mods/twilight_visuals.dusk
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:
      - name: Check out mod source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-28" "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up Ninja
        run: python3 -m pip install --disable-pip-version-check ninja

      - name: Fetch Dusklight source
        run: >-
          cmake -S . -B build-fetch-android -G Ninja
          -DDUSKLIGHT_VERSION=b245c6bef8b4a370afb2453104a585dd41c97676

      - name: Configure Dusklight Android dependencies
        run: cmake --preset android-arm64
        working-directory: dusklight

      - name: Build Dusklight Android dependency tree
        run: cmake --build --preset android-arm64 --target dusklight --parallel
        working-directory: dusklight

      - name: Configure Twilight Visuals Android ARM64
        run: >-
          cmake -S . -B build-ci-android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DDUSKLIGHT_DIR="${{ github.workspace }}/dusklight"
          -DDUSKLIGHT_BUILD_DIR="${{ github.workspace }}/dusklight/build/android-arm64"
          -DDUSKLIGHT_VERSION=b245c6bef8b4a370afb2453104a585dd41c97676

      - name: Build Android mod package
        run: cmake --build build-ci-android --target twilight_visuals_package --parallel

      - name: Stage Twilight Visuals into Android APK assets
        run: |
          mkdir -p dusklight/build/android-arm64/bundled_mods
          cp build-ci-android/mods/twilight_visuals.dusk \
            dusklight/build/android-arm64/bundled_mods/twilight_visuals.dusk

      - name: Build Dusklight Android APK
        run: ./gradlew :app:assembleDebug
        working-directory: dusklight/platforms/android

      - name: Upload Android ARM64 mod package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-visuals-vanilla-android-arm64
          path: build-ci-android/mods/twilight_visuals.dusk
          if-no-files-found: error

      - name: Upload Dusklight Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-twilight-visuals-android-arm64-debug
          path: dusklight/platforms/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
